name: BD KB IT Auto Update

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */3 * * *"

permissions:
  contents: write

concurrency:
  group: bd-kb-it-update
  cancel-in-progress: false

jobs:
  update:
    name: Generate and Publish Playlist
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Requirements
        run: |
          set -e

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Check Required Files
        run: |
          set -e

          if [ ! -f "BD-KB-IT.py" ]; then
            echo "ERROR: BD-KB-IT.py not found!"
            exit 1
          fi

          echo "Python script found."

      - name: Check API Secret
        env:
          API_URL: ${{ secrets.BD_KB_IT_API_URL }}
        run: |
          set -e

          if [ -z "${API_URL:-}" ]; then
            echo "ERROR: BD_KB_IT_API_URL secret is missing!"
            exit 1
          fi

          case "$API_URL" in
            https://*|http://*)
              echo "API secret configured."
              ;;
            *)
              echo "ERROR: Invalid API URL format."
              exit 1
              ;;
          esac

      - name: Run BD KB IT
        env:
          BD_KB_IT_API_URL: ${{ secrets.BD_KB_IT_API_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -e

          echo "Starting BD KB IT..."

          python -u BD-KB-IT.py

      - name: Verify Playlist
        run: |
          set -e

          FILE="output/BD-KB-IT.m3u8"

          if [ ! -s "$FILE" ]; then
            echo "ERROR: Playlist missing or empty!"
            exit 1
          fi

          if ! grep -q "^#EXTM3U" "$FILE"; then
            echo "ERROR: Invalid M3U8 header!"
            exit 1
          fi

          echo "Playlist verified successfully."

          echo "Total channels:"
          grep -c "^#EXTINF" "$FILE" || true

          echo "Playlist preview:"
          head -n 15 "$FILE"

      - name: Upload Playlist Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BD-KB-IT-${{ github.run_number }}
          path: |
            output/BD-KB-IT.m3u8
            output/ALL_CHANNEL_DATA.json
            output/health_report.json
            output/dead_channels.json
            output/logo_cache.json
            output/groups_index.json
            output/speed_report.json
            output/validation_cache.json
          retention-days: 30
          if-no-files-found: warn

      - name: Commit and Push
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f output/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto update BD-KB-IT playlist"

          git pull --rebase origin "$GITHUB_REF_NAME"

          git push origin "HEAD:${GITHUB_REF_NAME}"

          echo "Repository updated successfully."

      - name: Workflow Summary
        if: always()
        run: |
          echo "## BD KB IT Auto Update" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Playlist: BD-KB-IT.m3u8" >> "$GITHUB_STEP_SUMMARY"
          echo "- Schedule: Every 3 hours UTC" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gist: Disabled" >> "$GITHUB_STEP_SUMMARY"
          echo "- API Token: Disabled" >> "$GITHUB_STEP_SUMMARY"
          echo "- API URL: Hidden" >> "$GITHUB_STEP_SUMMARY"
          echo "- M3U8 Finder: Enabled" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pagination: Enabled" >> "$GITHUB_STEP_SUMMARY"
          echo "- Duplicate Filter: Enabled" >> "$GITHUB_STEP_SUMMARY"
