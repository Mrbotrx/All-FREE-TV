name: BD KB IT Auto Update

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Requirements
        run: pip install -r requirements.txt

      - name: Run Script
        env:
          BD_KB_IT_API_URL: ${{ secrets.BD_KB_IT_API_URL }}
        run: python BD-KB-IT.py

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          git diff --cached --quiet || (
            git commit -m "Auto update playlist and JSON"
            git push
          )
