name: BD KB IT Auto Update

"on":
  workflow_dispatch:

  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: write

concurrency:
  group: bd-kb-it-update
  cancel-in-progress: false

jobs:
  update:
    name: Generate and Publish Playlist
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 3. Install Requirements
      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt not found"
          fi

      # 4. Run Python Script
      - name: Run BD-KB-IT
        env:
          BD_KB_IT_API_URL: ${{ secrets.BD_KB_IT_API_URL }}
        run: |
          python BD-KB-IT.py

      # 5. Verify Playlist
      - name: Verify Output Files
        run: |
          echo "Checking output directory..."

          ls -lah output/

          FILE="output/BD-KB-IT.m3u8"

          if [ ! -s "$FILE" ]; then
            echo "ERROR: Playlist missing or empty!"
            exit 1
          fi

          echo "Playlist verified!"

          echo "Channel count:"
          grep -c "^#EXTINF" "$FILE" || true

          echo "Playlist preview:"
          head -n 15 "$FILE"

      # 6. Update GitHub Gist
      - name: Auto Update GitHub Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          set -e

          FILE="output/BD-KB-IT.m3u8"

          if [ -z "$GIST_TOKEN" ]; then
            echo "ERROR: GIST_TOKEN missing!"
            exit 1
          fi

          if [ -z "$GIST_ID" ]; then
            echo "ERROR: GIST_ID missing!"
            exit 1
          fi

          if [ ! -s "$FILE" ]; then
            echo "ERROR: Playlist missing!"
            exit 1
          fi

          jq -n \
            --rawfile content "$FILE" \
            '{
              files: {
                "BD-KB-IT.m3u8": {
                  content: $content
                }
              }
            }' > gist.json

          curl --fail-with-body -sS \
            -X PATCH \
            "https://api.github.com/gists/$GIST_ID" \
            -H "Authorization: Bearer $GIST_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data-binary @gist.json \
            -o gist_response.json

          echo "GIST UPDATE SUCCESSFUL!"

          echo "Updated Raw URL:"
          jq -r '.files["BD-KB-IT.m3u8"].raw_url' gist_response.json

      # 7. Upload Artifacts
      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playlist-${{ github.run_number }}
          path: |
            output/BD-KB-IT.m3u8
            output/ALL_CHANNEL_DATA.json
            output/health_report.json
            output/dead_channels.json
          retention-days: 30
          if-no-files-found: warn

      # 8. Commit Changes
      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f output/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto update JSON and M3U8"

          git push
