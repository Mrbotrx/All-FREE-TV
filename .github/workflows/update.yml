name: BD KB IT Auto Update

on:
workflow_dispatch:

schedule:
- cron: "0 */3 * * *"

permissions:
contents: write

concurrency:
group: bd-kb-it-update
cancel-in-progress: false

jobs:
update:
name: Generate and Publish Playlist
runs-on: ubuntu-latest
timeout-minutes: 30

steps:
  # 1. Checkout Repository
  - name: Checkout
    uses: actions/checkout@v4
    with:
      fetch-depth: 0
      persist-credentials: true

  # 2. Setup Python
  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  # 3. Install Requirements
  - name: Install Requirements
    run: |
      set -e

      python -m pip install --upgrade pip

      if [ -f requirements.txt ]; then
        pip install -r requirements.txt
      else
        echo "requirements.txt not found."
      fi

  # 4. Check Python Script
  - name: Check Python Script
    run: |
      if [ ! -f "BD-KB-IT.py" ]; then
        echo "ERROR: BD-KB-IT.py not found!"
        ls -lah
        exit 1
      fi

      echo "Python script found!"

  # 5. Run Python Script
  - name: Run BD-KB-IT
    env:
      BD_KB_IT_API_URL: ${{ secrets.BD_KB_IT_API_URL }}
    run: |
      set -e

      export BD_KB_IT_API_URL="${BD_KB_IT_API_URL:-https://web.aynaott.com/api/v5/pages/live-tvs/}"

      echo "Starting BD KB IT..."
      python -u BD-KB-IT.py

  # 6. Verify Playlist
  - name: Verify Playlist
    run: |
      set -e

      FILE="output/BD-KB-IT.m3u8"

      echo "Checking output directory..."
      ls -lah output/

      if [ ! -s "$FILE" ]; then
        echo "ERROR: Playlist missing or empty!"
        exit 1
      fi

      if ! grep -q "^#EXTM3U" "$FILE"; then
        echo "ERROR: Invalid M3U8 header!"
        exit 1
      fi

      echo "Playlist verified!"

      echo "Total entries:"
      grep -c "^#EXTINF" "$FILE" || true

      echo "Playlist preview:"
      head -n 15 "$FILE"

  # 7. Upload Artifacts
  - name: Upload Artifacts
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: BD-KB-IT-playlist-${{ github.run_number }}
      path: |
        output/BD-KB-IT.m3u8
        output/ALL_CHANNEL_DATA.json
        output/health_report.json
        output/dead_channels.json
      retention-days: 30
      if-no-files-found: warn

  # 8. Commit and Push
  - name: Commit Changes
    run: |
      set -e

      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add -f output/

      if git diff --cached --quiet; then
        echo "No changes to commit."
        exit 0
      fi

      git commit -m "Auto update BD-KB-IT playlist"

      git push origin "HEAD:${GITHUB_REF_NAME}"

      echo "Repository updated successfully!"

  # 9. Final Summary
  - name: Update Summary
    if: always()
    run: |
      echo "## BD KB IT Auto Update" >> "$GITHUB_STEP_SUMMARY"
      echo "" >> "$GITHUB_STEP_SUMMARY"
      echo "- Playlist: output/BD-KB-IT.m3u8" >> "$GITHUB_STEP_SUMMARY"
      echo "- Schedule: Every 2 hours (UTC)" >> "$GITHUB_STEP_SUMMARY"
      echo "- Gist: Removed" >> "$GITHUB_STEP_SUMMARY"
