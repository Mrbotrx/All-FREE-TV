name: BD KB IT Auto Update

on:
workflow_dispatch:

schedule:
- cron: "0 */2 * * *"

permissions:
contents: write

concurrency:
group: bd-kb-it-update
cancel-in-progress: false

jobs:
update:
runs-on: ubuntu-latest
timeout-minutes: 30

steps:
  - name: Checkout
    uses: actions/checkout@v4
    with:
      fetch-depth: 0
      persist-credentials: true

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"
      cache: "pip"

  - name: Install Requirements
    run: |
      python -m pip install --upgrade pip
      if [ -f requirements.txt ]; then
        pip install -r requirements.txt
      else
        echo "No requirements.txt — skipping"
      fi

  - name: Run Script
    env:
      BD_KB_IT_API_URL: ${{ secrets.BD_KB_IT_API_URL }}
    run: |
      python BD-KB-IT.py

  - name: Verify Output Files
    run: |
      echo "=== output/ contents ==="
      ls -lah output/ || true

      if [ ! -s output/BD-KB-IT.m3u8 ]; then
        echo "Playlist not created or empty!"
        exit 1
      fi

      echo "=== Playlist head ==="
      head -n 15 output/BD-KB-IT.m3u8

      echo "=== Channel count ==="
      grep -c "^#EXTINF" output/BD-KB-IT.m3u8 || true

  - name: Auto Update GitHub Gist
    env:
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      GIST_ID: ${{ secrets.GIST_ID }}
    run: |
      set -e

      FILE="output/BD-KB-IT.m3u8"

      if [ ! -s "$FILE" ]; then
        echo "Playlist missing or empty!"
        exit 1
      fi

      jq -n \
        --rawfile content "$FILE" \
        '{files: {"BD-KB-IT.m3u8": {content: $content}}}' \
        > gist.json

      RESPONSE=$(curl --fail-with-body -sS \
        -X PATCH \
        "https://api.github.com/gists/$GIST_ID" \
        -H "Authorization: Bearer $GIST_TOKEN" \
        -H "Accept: application/vnd.github+json" \
        -H "X-GitHub-Api-Version: 2022-11-28" \
        -H "Content-Type: application/json" \
        --data-binary @gist.json)

      echo "GIST UPDATE SUCCESSFUL!"

      echo "$RESPONSE" | jq -r '.files["BD-KB-IT.m3u8"].raw_url'

  - name: Upload Artifacts
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: playlist-${{ github.run_number }}
      path: |
        output/BD-KB-IT.m3u8
        output/ALL_CHANNEL_DATA.json
        output/health_report.json
        output/dead_channels.json
      retention-days: 30

  - name: Commit Changes
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add -f output/

      if git diff --cached --quiet; then
        echo "No changes to commit."
        exit 0
      fi

      git commit -m "Auto update JSON and M3U8 — $(date -u +'%Y-%m-%d %H:%M UTC')"

      for i in 1 2 3; do
        if git push; then
          echo "Pushed on attempt $i"
          break
        fi

        echo "Push failed, retrying ($i/3)..."
        git pull --rebase origin "${GITHUB_REF_NAME}" || true
        sleep 3

        if [ "$i" -eq 3 ]; then
          echo "Push failed after 3 attempts!"
          exit 1
        fi
      done
